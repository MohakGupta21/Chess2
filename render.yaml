# Render Blueprint — one web service that serves BOTH the API and the built
# client from a single origin (so the `SameSite=Lax` auth cookie works without
# any CORS / cross-site changes), plus a managed Postgres database for durable
# storage. See DEPLOY.md.
#
# Apply: Render Dashboard → New → Blueprint → point at this repo.
# After the first deploy, JWT_SECRET is generated and kept stable — do not
# rotate it or every user is logged out. DATABASE_URL is wired automatically.
#
# For a SPLIT deploy (client on a static host, API here) instead: drop
# CLIENT_DIST, set CLIENT_ORIGIN to the client's origin and COOKIE_SAMESITE=none
# (see DEPLOY.md "Split (cross-origin) deploy").

databases:
  - name: chess-db
    databaseName: chess
    user: chess
    plan: basic-256mb # smallest paid tier; "free" also works but expires

services:
  - type: web
    name: chess
    runtime: node
    plan: starter # no disk needed now that data lives in Postgres
    numInstances: 1 # fine to raise now; the DB no longer forces a single writer
    buildCommand: npm ci && npm run build # builds server -> client (client/dist)
    startCommand: npm start # node server/dist/index.js — runs migrations, then listens
    healthCheckPath: /api/health
    # Node version is pinned by .node-version / "engines" at the repo root.
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        # Render generates a strong value on first deploy and keeps it stable.
        # To use your own: `openssl rand -hex 32`.
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chess-db
          property: connectionString
      - key: CLIENT_DIST
        # Absolute path to the built client on Render's build host. Render checks
        # out the repo at /opt/render/project/src.
        value: /opt/render/project/src/client/dist
      - key: TRUST_PROXY
        value: "1" # one proxy hop (Render's LB) in front of the app
