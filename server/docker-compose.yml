# Local Postgres for development and tests. Start with:
#   docker compose -f server/docker-compose.yml up -d
#
# Creates two databases on localhost:5433:
#   chess       -> local dev   (config.ts default DATABASE_URL)
#   chess_test  -> test suite  (vitest.config.ts)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "5433:5432"
    volumes:
      - ./db-init.sql:/docker-entrypoint-initdb.d/10-db-init.sql:ro
      - chess_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  chess_pgdata:
